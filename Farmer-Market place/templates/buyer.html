<!DOCTYPE html>
<html>

<head>
    <title>Buyer Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header>
    <h1>🛒 Buyer Dashboard</h1>
    <a href="/">Home</a>
</header>

<div class="container">

    <h2>Search Products</h2>

    <form method="GET" action="/buyer">

        <input
            type="text"
            name="search"
            placeholder="Search crop..."
            value="{{ search }}"
        >

        <button type="submit">Search</button>

    </form>


    <h2>Available Products</h2>

    {% for product in products %}

    <div class="product-card">

        <h3>{{ product["name"] }}</h3>

        <p>
            📦 Quantity:
            {{ product["quantity"] }} kg
        </p>

        <p>
            💰 Price:
            ₹{{ product["price"] }}/kg
        </p>

        <p>
            📍 Location:
            {{ product["location"] }}
        </p>


        <form action="/order" method="POST">

    <!-- Product ID -->
    <input
        type="hidden"
        name="product_id"
        value="{{ product['id'] }}"
    >

    <!-- Buyer Name -->
    <input
        type="text"
        name="buyer_name"
        placeholder="Your Name"
        required
    >

    <!-- Quantity -->
    <input
        type="number"
        name="quantity"
        placeholder="Quantity (kg)"
        min="1"
        required
    >

    <!-- Delivery Location -->
    <input
        type="text"
        name="location"
        placeholder="Delivery Location"
        required
    >

    <!-- Latitude -->
    <input
        type="number"
        step="any"
        name="latitude"
        placeholder="Latitude (Example: 12.9716)"
        required
    >

    <!-- Longitude -->
    <input
        type="number"
        step="any"
        name="longitude"
        placeholder="Longitude (Example: 77.5946)"
        required
    >

    <button type="submit">
        🛒 Place Order
    </button>

</form>

    </div>

    {% else %}

    <p>No products available.</p>

    {% endfor %}

</div>

</body>
</html>
